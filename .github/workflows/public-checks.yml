name: Public checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install offline dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check release boundaries
        run: python scripts/check_public_release.py
      - name: Run offline example
        run: python examples/offline_factor_demo.py
      - name: Run selected engineering regressions
        run: python -m pytest -q
