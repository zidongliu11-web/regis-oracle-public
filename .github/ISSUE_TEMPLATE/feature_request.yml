name: 功能建议
description: 提议一个具体可验收的改进
title: "[Feature] "
body:
  - type: textarea
    id: use_case
    attributes:
      label: 使用场景与当前障碍
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 方案和完成条件
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案与限制

