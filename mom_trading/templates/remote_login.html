<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · Regis Oracle</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      color: #ecf1f8; background: radial-gradient(circle at 20% 10%, #20314f 0, transparent 35%), #090e19; }
    main { width: min(100%, 420px); padding: 32px; border: 1px solid #30405b; border-radius: 16px;
      background: #111b2a; box-shadow: 0 24px 72px #0008; }
    .eyebrow { color: #8fb0db; font-size: 12px; font-weight: 700; letter-spacing: .14em; }
    h1 { margin: 10px 0 8px; font-size: 27px; letter-spacing: .01em; }
    .intro { margin: 0 0 28px; color: #a8b7cc; line-height: 1.6; font-size: 14px; }
    label { display: block; margin: 16px 0 7px; color: #c6d2e2; font-size: 13px; font-weight: 600; }
    input[type=text], input[type=password] { width: 100%; min-height: 44px; padding: 10px 12px;
      border: 1px solid #425574; border-radius: 8px; outline: none; background: #0b1422;
      color: #f1f5fb; font: inherit; }
    input:focus-visible { border-color: #68a7ef; box-shadow: 0 0 0 3px #3d79b63d; }
    button { width: 100%; min-height: 45px; margin-top: 24px; border: 0; border-radius: 8px;
      background: #3e8cdb; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #5aa0e9; }
    .error { padding: 11px 12px; border: 1px solid #9c515e; border-radius: 8px;
      color: #ffd2d6; background: #43212b; font-size: 13px; }
    .note { margin: 20px 0 0; color: #8497af; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">REGIS ORACLE · CLOUD ACCESS</div>
    <h1>登录量化研究平台</h1>
    <p class="intro">使用原网站账号进入云端工作台。登录后仍由你决定是否交易。</p>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="{{ url_for('remote_login_page') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="next" value="{{ next_path }}">
      <label for="username">账号</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">进入工作台</button>
    </form>
    <p class="note">此页面通过 HTTPS 连接原腾讯云网站。不要在聊天中发送密码。</p>
  </main>
</body>
</html>
