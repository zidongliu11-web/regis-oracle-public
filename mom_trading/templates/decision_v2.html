<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>研究工作台 · Regis Oracle</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230A1420'/%3E%3Cpath d='M7 23V9h8a5 5 0 0 1 0 10H7m8 0 6 4' stroke='%2379C5E8' stroke-width='2.3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/decision_v2.css?v=6">
  <link rel="stylesheet" href="/static/decision_research.css?v=1">
</head>
<body data-decision-mode="research">
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="terminal-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="Regis Oracle 现有今日决策页">
        <span class="brand-mark" aria-hidden="true">R<span class="brand-mark-dot"></span></span>
        <span class="brand-copy"><strong>Regis Oracle</strong><small>情绪流研究与人工决策</small></span>
      </a>
      <nav class="primary-nav" aria-label="主要页面">
        <a href="/decision-v2" aria-current="page">今日决策台</a>
        <a href="/market-panorama">市场中心</a>
        <a href="/signals">提醒记录</a>
        <a href="/strategy-lab">策略与战法</a>
        <a href="/factor-system">因子研究</a>
        <a href="/risk">风险仓位</a>
        <a href="/data-center">数据中心</a>
      </nav>
      <div class="header-utilities">
        <div class="session-clocks" aria-label="交易和本机时钟">
          <span class="session-clock" id="beijingClock">北京时间待核验</span>
          <span class="session-clock" id="localClock">本机时间待核验</span>
        </div>
        <button class="refresh-button" id="refreshButton" type="button" aria-label="刷新决策台数据">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.35-5.65M20 4v5h-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>刷新</span>
        </button>
      </div>
    </header>

    <main id="main" class="workspace" tabindex="-1">
      {% include "decision_research.html" %}
    </main>
  </div>
  <script src="/static/decision_v2.js?v=23"></script>
  {% if config.get('LOCAL_RESEARCH_HISTORY_ENABLED', false) %}
  <script src="/static/local_data_connections.js?v=2"></script>
  <script src="/static/local_market_history.js?v=2"></script>
  {% endif %}
  <script src="/static/decision_research.js?v=1"></script>
</body>
</html>
